# Attach to an already-running F407. No application RAM/Flash writes,
# reset, halt, resume, or flash programming commands.
source [find interface/stlink.cfg]
transport select hla_swd
set WORKAREASIZE 0
source [find target/stm32f4x.cfg]
reset_config none
adapter speed 1000
# Remove the stock target's peripheral/debug-register setup callbacks.
stm32f4x.cpu configure -event examine-end {}
stm32f4x.cpu configure -event trace-config {}
stm32f4x.cpu configure -event reset-init {}
stm32f4x.cpu configure -event reset-start {}
stm32f4x.cpu configure -event gdb-attach {}
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
poll
echo [stm32f4x.cpu curstate]
echo CHIP_ID
mem2array words 32 0xE0042000 1
echo $words(0)
echo CPU_ID
mem2array words 32 0xE000ED00 1
echo $words(0)
echo FLASH_SIZE_KIB
mem2array halfwords 16 0x1FFF7A22 1
echo $halfwords(0)
shutdown
