name: Python contracts and package
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -e '.[desktop,dev]'
      - run: ruff check src tools/field tools/release tools/calibration tools/build
      - run: ruff format --check src tests tools/field tools/release tools/calibration tools/build
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m build --wheel
