<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桶身测距 · 实时预览</title>
<style>
:root { color-scheme: dark; font-family: Inter, system-ui, "PingFang SC", sans-serif; background: #111616; color: #f3f8f6; }
* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 1328px; margin: auto; padding: 18px clamp(12px, 2vw, 24px); }
header, .reading, .rates { display: flex; align-items: center; }
header { justify-content: space-between; gap: 12px; padding-bottom: 14px; }
.reading { gap: 16px; }
h1 { margin: 0 0 2px; font-size: 13px; font-weight: 500; color: #bdcbc6; }
.value { font-size: clamp(32px, 4vw, 48px); font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums; }
small { font-size: 16px; color: #bdcbc6; }
#state { font-size: 14px; color: #c4cdca; }
#state::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 7px; background: currentColor; border-radius: 50%; }
main[data-tone="ok"] #state { color: #73e7b2; }
main[data-tone="wait"] #state { color: #f2c073; }
.rates { gap: 18px; font-variant-numeric: tabular-nums; font-size: 13px; color: #bdcbc6; }
.rates span { white-space: nowrap; }
.rates b { font-weight: 550; color: #f3f8f6; }
#feed { display: block; width: 100%; max-height: calc(100dvh - 115px); aspect-ratio: 16/9; object-fit: contain; background: #090c0c; border-radius: 8px; }
main.offline #feed { visibility: hidden; }
@media (max-width: 540px) {
  main { padding-top: 12px; }
  .reading { gap: 12px; }
  .rates { flex-direction: column; align-items: end; gap: 4px; font-size: 12px; }
}
</style>
</head>
<body>
<main id="monitor">
<header>
  <div class="reading">
    <div><h1>桶身距离</h1><span class="value" id="distance">—</span> <small>cm</small></div>
    <span id="state" role="status">等待画面</span>
  </div>
  <div class="rates"><span>画面 <b id="fps">—</b> FPS</span><span>测距 <b id="hz">—</b> Hz</span></div>
</header>
<img id="feed" src="/stream.mjpg" alt="校正左目画面及当前测距桶框">
</main>
<script>
const el = id => document.getElementById(id);
const monitor = el('monitor');
let lastSource = null, sourceSeenAt = 0;
function show(data) {
  const offline = !data || data.frame_age_s > 1.5;
  const active = !offline && Boolean(data.frame_id);
  const valid = active && data.detected && Number.isFinite(data.distance_m);
  const now = performance.now();
  if (!valid || data.distance_source_frame !== lastSource) sourceSeenAt = now;
  lastSource = valid ? data.distance_source_frame : null;
  const age = valid ? (data.distance_age_ms ?? (now - sourceSeenAt)) + data.frame_age_s * 1000 : 0;
  const held = valid && data.measurement_status === 'held' && age > (data.depth_scale === 0.5 ? 600 : 1200);
  let state = '等待画面', tone = '';
  if (offline) state = '画面已断开';
  else if (active && !data.detected) state = '未检出桶';
  else if (active && !valid) { state = '已检出桶 · 暂无距离'; tone = 'wait'; }
  else if (held) { state = '沿用上次距离'; tone = 'wait'; }
  else if (valid) { state = '已检出桶'; tone = 'ok'; }
  monitor.classList.toggle('offline', offline);
  monitor.dataset.tone = tone;
  el('state').textContent = state;
  el('distance').textContent = valid ? Math.round(data.distance_m * 100) : '—';
  el('fps').textContent = active && Number.isFinite(data.processing_fps) ? Math.round(data.processing_fps) : '—';
  el('hz').textContent = active && Number.isFinite(data.fresh_distance_hz) ? data.fresh_distance_hz.toFixed(1) : '—';
}
async function poll() {
  try {
    const response = await fetch('/status', {cache: 'no-store', signal: AbortSignal.timeout(1500)});
    if (!response.ok) throw new Error();
    const data = await response.json();
    if (monitor.classList.contains('offline') && data.frame_id && data.frame_age_s <= 1.5) el('feed').src = '/stream.mjpg?t=' + Date.now();
    show(data);
  } catch { show(null); }
  setTimeout(poll, 200);
}
poll();
</script>
</body>
</html>
