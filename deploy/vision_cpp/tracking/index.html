<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>桶识别与追踪</title>
<style>
:root{color-scheme:dark;font:15px/1.5 system-ui,"PingFang SC",sans-serif;color:#e9eeeb;background:#101514}
*{box-sizing:border-box}
body{margin:0}
main{width:min(100%,1720px);margin:auto;padding:clamp(12px,2vw,32px)}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
h1{font-size:21px;font-weight:650;margin:0}
#status{display:flex;align-items:center;gap:8px;color:#f0c975;text-align:right}
#status::before{content:"";width:8px;height:8px;flex:none;border-radius:50%;background:currentColor}
#status.good{color:#89ddb1}
#status.bad,#error{color:#ffad9c}
.console{display:grid;grid-template-columns:minmax(0,8fr) minmax(214px,3fr);gap:16px;align-items:start}
#stage{position:relative;background:#050807;aspect-ratio:16/9;width:100%;overflow:hidden;border-radius:6px}
#feed,#selection{width:100%;height:100%;display:block;object-fit:contain}
#selection{position:absolute;inset:0;display:none;cursor:crosshair;touch-action:none}
aside{background:#19201e;border:1px solid #34423c;border-radius:6px;padding:clamp(14px,1.7vw,26px);display:grid;gap:18px}
.metrics{margin:0;display:grid;gap:14px}
dt,summary{font-size:14px;color:#afbeb5}
dd{margin:3px 0 0;font-size:clamp(19px,1.8vw,29px);font-weight:550;font-variant-numeric:tabular-nums}
.actions,.options{display:flex;flex-wrap:wrap;gap:8px}
button,summary{font:inherit;cursor:pointer}button{padding:9px 14px;border-radius:5px;color:inherit;background:#24332c;border:1px solid #45594e}
.actions button{flex:1 0 auto}button:hover{filter:brightness(1.18)}button:disabled{opacity:.45;cursor:not-allowed}
#stop{background:#502b29;border-color:#87524c}#start{background:#254d3d}
details{border-top:1px solid #34423c;padding-top:12px}
summary{width:fit-content}.options{margin-top:12px}
#error,#help{margin:0;font-size:14px;overflow-wrap:anywhere}
#error:empty,#help:empty,[hidden]{display:none!important}
@media(max-width:740px){main{padding:12px}header{margin-bottom:10px}.console{grid-template-columns:1fr;gap:10px}aside{gap:12px}.metrics{display:flex;flex-wrap:wrap;gap:12px 32px}h1{font-size:18px}}
</style></head><body><main>
<header><h1>桶追踪</h1><span id="status" role="status">正在连接</span></header>
<div class="console">
<div id="stage"><img id="feed" src="/stream.mjpg" alt="实时追踪画面与中心准星"><canvas id="selection" width="1280" height="720"></canvas></div>
<aside aria-label="追踪读数与控制">
<dl class="metrics">
<div><dt>中心偏差</dt><dd id="offset">—</dd></div>
<div><dt>画面输出 / 跟踪</dt><dd id="rates">—</dd></div>
<div id="distanceGroup" hidden><dt>目标距离</dt><dd id="distance"></dd></div>
</dl>
<p id="error" role="alert"></p>
<label id="legacyIsolation" hidden><input id="isolated" type="checkbox">已断开底盘行走动力</label>
<div class="actions"><button id="start" disabled hidden>恢复追踪</button><button id="stop">停止机构</button></div>
<details><summary>目标选择</summary><div class="options"><button id="auto">自动识别</button><button id="select">框选容器</button><button id="cancel" hidden>取消框选</button></div></details>
<p id="help"></p>
</aside></div>
</main><script>
const token='__CONTROL_TOKEN__', el=id=>document.getElementById(id);
let current=null, first=null, selecting=false, busy=false;
const reasons={target_reacquiring:'短暂丢失：机构已暂停，正在确认同一目标',target_reacquire_timeout:'目标暂不可见',target_appearance_ambiguous:'目标匹配不唯一，机构暂停',operator_stop:'已停止',operator_connection_lost:'页面连接中断，已请求停止',working_range_limit:'当前方向已到行程边界；仍监测其他方向偏差',origins_or_heading_not_ready:'请先恢复零位和航向',pose_outside_working_range:'当前位置超出工作范围或 C 位置不匹配',arm_not_stopped_or_another_controller:'机构尚未禁用或串口正由其他程序控制',no_fresh_telemetry:'未收到稳定串口回传',target_appearance_lost:'目标外观丢失，请重新选择',target_lost_geometry:'目标形状变化或被遮挡，请重新选择',target_lost_flow:'目标运动无法确认，请重新选择',insufficient_feature_coverage:'目标可用细节不足，请重新选择',target_geometry_jump:'目标变化过大，请重新选择',target_outside_tracking_window:'目标离开可追踪区域，请重新选择',tracking_frame_gap:'画面间隔过长，已请求停止',alignment_error_increased:'调整后偏差增大，已请求停止',telemetry_timeout:'串口回传超时，已请求停止',target_lost_features:'目标丢失，请重新选择',stale_target:'等待目标位置更新',waiting_for_target_frame:'正在等待新画面，恢复后自动续跟',stale_camera:'相机画面过期',selection_changed_reselect:'目标已移动，请重新框选',target_has_too_few_features:'目标细节不足，请扩大框选范围',target_has_too_little_texture:'目标纹理不足，请扩大框选范围'};
async function api(action,body={}){const r=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-Control-Token':token},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.error||'操作失败');return data;}
function showError(e){el('error').textContent=e.message||String(e);}
function textReason(reason){return reasons[reason]||reason||'';}
reasons.startup_pose_or_driver_feedback_not_ready='启动位置或回零反馈未就绪，请检查机构状态';
reasons.firmware_fault='机构报告故障，已暂停运动';
reasons.startup_disable_ack_timeout='启动停用确认超时，未开始运动';
function render(s){current=s;const t=s.tracking||{},arm=t.arm||{},q=arm.telemetry,target=t.target_age_s!=null&&t.target_age_s>.15?null:t.target,stale=(s.preview?.frame_age_s??s.frame_age_s)>.4;
 el('rates').textContent=s.preview&&!stale?s.preview.fps.toFixed(1)+' / '+s.preview.tracking_fps.toFixed(1)+' FPS':'—';
 el('legacyIsolation').hidden=!!t.continuous||!!t.active||!t.motion_available;
 el('start').hidden=t.active||!t.motion_available;
 el('start').disabled=!t.motion_available||selecting||stale||t.active||busy;
 el('select').disabled=busy;el('auto').disabled=busy;
 el('status').className=arm.phase==='stop_unconfirmed'?'bad':target&&!stale&&t.active?'good':'';
 const states={waiting_frame:'等待新画面，自动续跟已保持',reacquiring:'机构暂停，正在找回同一桶',following:'连续跟随中',searching:'自动寻找目标',moving:'正在对准',stopping:'正在停止，等待回传',holding:'已居中 · 容差内保持',idle:target?'目标已锁定':'等待连续识别',disabled:'机构已禁用',stop_unconfirmed:'停止未确认，请现场检查'};
 states.preparing='正在准备伸缩臂工作位置';
 el('status').textContent=stale?(t.automatic?'等待新画面，恢复后自动续跟':'画面离线'):t.active?(states[arm.phase]||arm.phase):(target?'目标已锁定 · 观察中':t.vision_state==='reacquiring'?'正在找回目标 · 观察中':t.mode==='manual'?'等待重新框选':t.automatic?'自动寻找目标':'正在识别目标 · 已暂停');
 if(t.active&&t.vision_state==='reacquiring')el('status').textContent=states.reacquiring;
 if(t.active&&!q)el('status').textContent='正在核对机构回传';
 if(arm.phase==='stop_unconfirmed')el('status').textContent=states.stop_unconfirmed;
 if(q?.system_fault||q?.motor_fault){el('status').textContent='机构故障';el('status').className='bad';}
 if(!t.motion_available&&arm.phase!=='stop_unconfirmed')el('status').textContent+=' · 只读';
 const direction=(value,negative,positive)=>value===0?'0':(value<0?negative:positive)+Math.abs(value).toFixed(0);
 el('offset').textContent=target&&!stale?direction(Math.round(target.offset_px[0]),'左','右')+' / '+direction(Math.round(target.offset_px[1]),'上','下')+' px':'—';
 let matched=false;if(target&&s.selected){const a=target.box,b=[s.selected.left,s.selected.top,s.selected.right,s.selected.bottom],ix=Math.max(0,Math.min(a[2],b[2])-Math.max(a[0],b[0])),iy=Math.max(0,Math.min(a[3],b[3])-Math.max(a[1],b[1]));matched=ix*iy/((a[2]-a[0])*(a[3]-a[1])+(b[2]-b[0])*(b[3]-b[1])-ix*iy)>.5;}
 el('distanceGroup').hidden=!(matched&&!stale&&s.frame_age_s<.4&&Number.isFinite(s.distance_m));
 if(!el('distanceGroup').hidden)el('distance').textContent=(s.distance_m*100).toFixed(1)+' cm';
 if(!busy)el('error').textContent=['target_reacquiring','operator_stop','waiting_for_target_frame'].includes(t.reason)?'':textReason(t.reason);
}
async function refresh(){try{const r=await fetch('/status',{cache:'no-store'});render(await r.json());if(current.tracking?.active)await api('heartbeat');}catch(e){el('status').textContent='连接已断开';el('start').disabled=true;el('status').className='bad';el('offset').textContent='—';el('distanceGroup').hidden=true;showError(e);}finally{setTimeout(refresh,350);}}
function unfreeze(){selecting=false;first=null;el('selection').style.display='none';el('cancel').hidden=true;el('feed').style.visibility='visible';el('help').textContent='';}
el('auto').onclick=async()=>{try{unfreeze();await api('auto');}catch(e){showError(e);}};
el('start').onclick=async()=>{try{await api('start',{chassis_isolated:el('isolated').checked});}catch(e){showError(e);}};
el('stop').onclick=async()=>{try{await api('stop');}catch(e){showError(e);}};
el('cancel').onclick=unfreeze;
el('select').onclick=async()=>{busy=true;try{await api('stop');const until=Date.now()+6000;while(true){const r=await fetch('/status');const s=await r.json();if(['disabled','idle'].includes(s.tracking.arm.phase))break;if(Date.now()>until)throw new Error('禁用尚未确认，不能框选');await new Promise(r=>setTimeout(r,100));}selecting=true;el('selection').style.display='block';el('cancel').hidden=false;el('selection').getContext('2d').clearRect(0,0,1280,720);el('help').textContent='在实时画面拖动框住容器主体，画面持续更新。松开后锁定目标，再开始机构追踪。';}catch(e){showError(e);}finally{busy=false;}};
function point(event){const r=el('selection').getBoundingClientRect();return[Math.max(0,Math.min(1280,(event.clientX-r.left)*1280/r.width)),Math.max(0,Math.min(720,(event.clientY-r.top)*720/r.height))];}
el('selection').onpointerdown=e=>{if(!selecting)return;first=point(e);el('selection').setPointerCapture(e.pointerId);};
el('selection').onpointermove=e=>{if(!first)return;const end=point(e),ctx=el('selection').getContext('2d');ctx.clearRect(0,0,1280,720);ctx.strokeStyle='#ffe36c';ctx.lineWidth=3;ctx.strokeRect(first[0],first[1],end[0]-first[0],end[1]-first[1]);};
el('selection').onpointerup=async e=>{if(!first)return;const end=point(e),start=first;first=null;const box=[Math.round(Math.min(start[0],end[0])),Math.round(Math.min(start[1],end[1])),Math.round(Math.max(start[0],end[0])),Math.round(Math.max(start[1],end[1]))];try{const r=await fetch('/snapshot.jpg',{cache:'no-store'});if(!r.ok)throw new Error('实时画面尚未就绪');const frameId=Number(r.headers.get('X-Frame-Id'));await r.arrayBuffer();await api('select',{frame_id:frameId,box});unfreeze();}catch(err){showError(err);}};
window.addEventListener('pagehide',()=>{if(current?.tracking?.continuous)return;fetch('/api/stop',{method:'POST',headers:{'Content-Type':'application/json','X-Control-Token':token},body:'{}',keepalive:true}).catch(()=>{});});
refresh();
</script></body></html>
