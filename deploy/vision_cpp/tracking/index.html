<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>桶追踪控制台</title><style>
:root{color-scheme:dark;font:14px/1.5 system-ui,"PingFang SC",sans-serif;color:#e7eee9;background:#101614}*{box-sizing:border-box}body{margin:0}main{max-width:1720px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}h1{font-size:20px;margin:0;font-weight:650}h2{font-size:13px;color:#a7b9af;font-weight:500;margin:0 0 12px}#status{color:#f0c975;display:flex;align-items:center;gap:8px}#status:before{content:"";width:7px;height:7px;background:currentColor;border-radius:50%}#status.good{color:#87d9ad}#status.bad,#error{color:#ffab9d}.console{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}.view{min-width:0}#stage{position:relative;width:100%;aspect-ratio:16/9;background:#080c0a;border:1px solid #2b3a31;border-radius:12px;overflow:hidden}#feed,#selection{width:100%;height:100%;display:block;object-fit:contain}#selection{position:absolute;inset:0;display:none;cursor:crosshair;touch-action:none}.view-footer{display:flex;justify-content:space-between;gap:16px;color:#82988b;font-size:12px;margin:10px 2px}aside{display:grid;gap:14px}.card{padding:18px;background:#19221d;border:1px solid #304137;border-radius:12px}#startupProgress{font-size:18px;font-weight:550;margin:0 0 14px}.checks{display:flex;gap:6px;flex-wrap:wrap}.check{font-size:11px;padding:4px 7px;border-radius:5px;background:#29322b;color:#bdba96}.check.ok{color:#9ed7b5;background:#203a2c}.metrics{display:grid;gap:12px;margin:16px 0 0}dt{font-size:11px;color:#92a79b}dd{margin:3px 0 0;font-variant-numeric:tabular-nums;font-size:14px}.actions{display:flex;gap:8px;margin-top:18px}button{font:inherit;cursor:pointer;color:inherit;border:1px solid #455a4d;border-radius:7px;padding:9px 12px;background:#24372c}button:hover{filter:brightness(1.12)}button:disabled{opacity:.4;cursor:default}.actions button{flex:1}#stop{background:#512b28;border-color:#82493e}#start{background:#24563c}.log-card{padding-bottom:10px}#eventLog{height:260px;overflow:auto;scrollbar-width:thin;font-size:12px}.log-row{display:grid;grid-template-columns:61px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #29372e}.log-row time{color:#7d9687;font-variant-numeric:tabular-nums}.log-row.warning{color:#e3cb8b}.log-row.error{color:#efa795}.muted,#startupReport{color:#8ca295;font-size:11px;margin:10px 0 0}#error{font-size:12px;margin:10px 0 0}#error:empty,#startupReport:empty,#help:empty,[hidden]{display:none!important}details{font-size:12px;color:#9eb2a6;padding:0 3px}summary{cursor:pointer}.options{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}#help{font-size:12px;color:#d2c891}
@media(max-width:800px){main{padding:12px}.console{grid-template-columns:1fr}aside{grid-template-columns:1fr 1fr}.log-row{grid-template-columns:1fr;gap:0}#eventLog{height:240px}}@media(max-width:520px){aside{grid-template-columns:1fr}.view-footer{display:block}.log-row{grid-template-columns:61px 1fr}#eventLog{height:210px}}
</style></head><body><main>
<header><h1>桶追踪控制台</h1><span id="status" role="status">正在连接</span></header>
<div class="console"><section class="view"><div id="stage"><img id="feed" alt="实时追踪画面"><canvas id="selection" width="1280" height="720"></canvas></div>
<div class="view-footer"><span id="videoDelivery">正在获取最新画面</span><span>板端处理 <b id="rates">—</b></span></div><p id="help"></p></section>
<aside><section class="card"><h2>自动运行</h2><p id="startupProgress">等待设备就绪</p><div class="checks"><span id="checkCamera" class="check">相机</span><span id="checkModel" class="check">模型</span><span id="checkSerial" class="check">串口</span></div>
<dl class="metrics"><div><dt>机构位置</dt><dd id="pose">—</dd></div><div><dt>中心偏差</dt><dd id="offset">—</dd></div></dl>
<p id="error" role="alert"></p><label id="legacyIsolation" hidden><input id="isolated" type="checkbox">底盘动力已断开</label>
<div class="actions"><button id="start" hidden>恢复自动运行</button><button id="stop">停止机构</button></div><p id="startupReport"></p></section>
<section class="card log-card"><h2>运行日志</h2><div id="eventLog" role="log" aria-live="polite"><p class="muted">正在等待设备状态…</p></div></section>
<details><summary>目标工具</summary><div class="options"><button id="auto">自动识别</button><button id="select">框选目标</button><button id="cancel" hidden>取消</button></div></details>
</aside></div></main><script>
const token='__CONTROL_TOKEN__', el=id=>document.getElementById(id);
let current=null, first=null, selecting=false, busy=false;
let frameURL=null, deliveredAt=0, deliveredFPS=0, frameTransfers=[], frameStarted=0;
const reasons={target_reacquiring:'短暂丢失：机构已暂停，正在确认同一目标',target_reacquire_timeout:'目标暂不可见',target_appearance_ambiguous:'目标匹配不唯一，机构暂停',operator_stop:'已停止',operator_connection_lost:'页面连接中断，已请求停止',working_range_limit:'当前方向已到行程边界；仍监测其他方向偏差',origins_or_heading_not_ready:'请先恢复零位和航向',pose_outside_working_range:'当前位置超出工作范围或 C 位置不匹配',arm_not_stopped_or_another_controller:'机构尚未禁用或串口正由其他程序控制',no_fresh_telemetry:'未收到稳定串口回传',target_appearance_lost:'目标外观丢失，请重新选择',target_lost_geometry:'目标形状变化或被遮挡，请重新选择',target_lost_flow:'目标运动无法确认，请重新选择',insufficient_feature_coverage:'目标可用细节不足，请重新选择',target_geometry_jump:'目标变化过大，请重新选择',target_outside_tracking_window:'目标离开可追踪区域，请重新选择',tracking_frame_gap:'画面间隔过长，已请求停止',alignment_error_increased:'调整后偏差增大，已请求停止',telemetry_timeout:'串口回传超时，已请求停止',target_lost_features:'目标丢失，请重新选择',stale_target:'等待目标位置更新',waiting_for_target_frame:'正在等待新画面，恢复后自动续跟',stale_camera:'相机画面过期',selection_changed_reselect:'目标已移动，请重新框选',target_has_too_few_features:'目标细节不足，请扩大框选范围',target_has_too_little_texture:'目标纹理不足，请扩大框选范围'};
async function api(action,body={}){const r=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-Control-Token':token},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.error||'操作失败');return data;}
function showError(e){el('error').textContent=e.message||String(e);}
function textReason(reason){return reasons[reason]||reason||'';}
Object.assign(reasons,{mcu_reset_reported:'已记录 STM32 重启，请确认后重新准备',power_cycle_confirmation_required:'正在等待设备就绪',power_cycle_preparing:'正在进行整机上电准备',power_cycle_wait_not_calibrated:'启动等待配置无效，请检查配置',power_cycle_origins_already_registered:'本轮起点已登记，已阻止重复登记',power_cycle_start_pose_mismatch:'回传与上电起点不一致，未登记零位',startup_ack_timeout_no_retry:'初始化回传未确认，已停止且不会重发零位登记',startup_origins_lost:'零位状态丢失，已停止；不能仅凭重连恢复',startup_self_check_lost:'启动自检状态失效，机构已停止',startup_state_unreadable:'初始化记录不可读，已暂停运动',firmware_fault:'机构报告故障，已暂停运动'});
Object.assign(reasons,{waiting_for_mcu_restart:'等待 STM32 就绪',startup_registration_uncertain:'上次起点登记未确认，已保持停止',mcu_restart_detected:'检测到 STM32 复位',power_cycle_preparing:''});
let lastLogId=null;
function renderEvents(events){
 const box=el('eventLog'),last=events.length?events[events.length-1].id:0;
 if(last===lastLogId)return;lastLogId=last;
 const bottom=box.scrollHeight-box.scrollTop-box.clientHeight<48;
 box.replaceChildren();
 for(const event of events){
   const row=document.createElement('div');row.className='log-row '+event.level;
   const time=document.createElement('time');time.textContent=new Date(event.at*1000).toLocaleTimeString('zh-CN',{hour12:false});
   const text=document.createElement('span');text.textContent=event.message;
   row.append(time,text);box.append(row);
 }
 if(!events.length){const empty=document.createElement('p');empty.className='muted';empty.textContent='正在等待设备状态…';box.append(empty);}
 if(bottom)box.scrollTop=box.scrollHeight;
}
function render(s){
 current=s;const t=s.tracking||{},arm=t.arm||{},q=arm.telemetry,startup=t.startup,checks=startup?.self_check;
 const target=t.target_age_s!=null&&t.target_age_s>.15?null:t.target,stale=(s.preview?.frame_age_s??s.frame_age_s)>.4;
 const states={waiting_device:'等待 STM32 连接',detecting_restart:'检测 STM32 状态',startup_waiting:'回零等待与自检',startup_checking:'等待自检就绪',startup_preparing:'正在准备机械臂',stop_unconfirmed:'停止未确认',following:'自动跟随',searching:'寻找目标',reacquiring:'目标暂失 · 等待重获',holding:'已居中 · 保持',waiting_frame:'等待新画面',stopping:'正在停止',disabled:'已暂停',idle:'设备就绪'};
 const preparation={waiting:'回零等待与自检',preflight:'核对机构状态',disable_pending:'确认串口通信',zero_pending:'登记 B/C 起点',registered:'起点已确认',a_check_left:'A 自检 · 左侧限位',a_check_right:'A 自检 · 右侧限位',a_moving:'A 回到 75°',c_moving:'C 准备中',ready:'自动追踪就绪',uncertain:'正在重新检查设备',unconfirmed:'等待设备启动'};
 el('status').textContent=states[arm.phase]||(t.active?'自动运行':'设备准备中');
 if(t.operator_paused)el('status').textContent='已手动暂停';
 if(!t.motion_available)el('status').textContent='只读观察';
 el('status').className=arm.phase==='stop_unconfirmed'?'bad':t.active?'good':'';
 const preparing=['startup_waiting','startup_checking','startup_preparing'].includes(arm.phase);
 el('startupProgress').textContent=preparing?(preparation[startup?.phase]||'自检中')+(arm.startup_wait_remaining_s>0?' · '+Math.ceil(arm.startup_wait_remaining_s)+' 秒':''):t.operator_paused?'自动流程已暂停':startup?.phase==='ready'?'准备完成':states[arm.phase]||'等待设备就绪';
 el('checkCamera').textContent=checks?.camera_fresh?'相机已就绪':'相机等待中';
 el('checkModel').textContent=checks?.inference_warmup?.ready?'模型已就绪':'模型预热中';
 el('checkSerial').textContent=q?'串口已连接':'串口等待中';
 for(const [id,ok] of [['checkCamera',checks?.camera_fresh],['checkModel',checks?.inference_warmup?.ready],['checkSerial',!!q]])el(id).className='check '+(ok?'ok':'');
 el('rates').textContent=s.preview&&!stale?s.preview.tracking_fps.toFixed(1)+' FPS':'—';
 el('pose').textContent=q?`A ${q.servo_software_deg}° · B ${q.lift_position_mm.toFixed(1)} · C ${q.slide_position_mm.toFixed(1)} mm`:'—';
 el('offset').textContent=target&&!stale?`横向 ${Math.round(target.offset_px[0])} · 纵向 ${Math.round(target.offset_px[1])} px`:'等待目标';
 el('start').hidden=!t.motion_available||(!t.operator_paused&&(t.active||t.auto_prepare));
 el('start').disabled=busy||!t.motion_available;
 el('stop').disabled=!t.motion_available;
 el('legacyIsolation').hidden=!!t.continuous||!t.motion_available;
 el('select').disabled=busy;el('auto').disabled=busy;
 const report=startup?.report;
 el('startupReport').textContent=report?'启动采样 · '+(report.metrics?.inference?.p95_ms!=null?'推理 P95 '+report.metrics.inference.p95_ms.toFixed(0)+' ms':'样本不足')+' · '+(report.status||'样本不足'):'';
 const quiet=['operator_stop','waiting_for_target_frame','target_reacquiring','power_cycle_preparing','power_cycle_confirmation_required','mcu_reset_reported','waiting_for_mcu_restart'];
 if(!busy)el('error').textContent=quiet.includes(t.reason)?'':textReason(t.reason);
 renderEvents(t.events||[]);
}
async function refresh(){try{const r=await fetch('/status',{cache:'no-store'});render(await r.json());if(current.tracking?.active)await api('heartbeat');}catch(e){el('status').textContent='连接已断开';el('start').disabled=true;el('status').className='bad';el('offset').textContent='—';showError(e);}finally{setTimeout(refresh,350);}}
function unfreeze(){selecting=false;first=null;el('selection').style.display='none';el('cancel').hidden=true;el('feed').style.visibility='visible';el('help').textContent='';}
el('auto').onclick=async()=>{try{unfreeze();await api('auto');}catch(e){showError(e);}};
el('start').onclick=async()=>{try{await api('start',{chassis_isolated:el('isolated').checked});}catch(e){showError(e);}};
el('stop').onclick=async()=>{try{await api('stop');}catch(e){showError(e);}};
el('cancel').onclick=unfreeze;
el('select').onclick=async()=>{busy=true;try{await api('stop');const until=Date.now()+6000;while(true){const r=await fetch('/status');const s=await r.json();if(['disabled','idle'].includes(s.tracking.arm.phase))break;if(Date.now()>until)throw new Error('禁用尚未确认，不能框选');await new Promise(r=>setTimeout(r,100));}selecting=true;el('selection').style.display='block';el('cancel').hidden=false;el('selection').getContext('2d').clearRect(0,0,1280,720);el('help').textContent='在实时画面拖动框住容器主体，画面持续更新。松开后锁定目标，再开始机构追踪。';}catch(e){showError(e);}finally{busy=false;}};
function point(event){const r=el('selection').getBoundingClientRect();return[Math.max(0,Math.min(1280,(event.clientX-r.left)*1280/r.width)),Math.max(0,Math.min(720,(event.clientY-r.top)*720/r.height))];}
el('selection').onpointerdown=e=>{if(!selecting)return;first=point(e);el('selection').setPointerCapture(e.pointerId);};
el('selection').onpointermove=e=>{if(!first)return;const end=point(e),ctx=el('selection').getContext('2d');ctx.clearRect(0,0,1280,720);ctx.strokeStyle='#ffe36c';ctx.lineWidth=3;ctx.strokeRect(first[0],first[1],end[0]-first[0],end[1]-first[1]);};
el('selection').onpointerup=async e=>{if(!first)return;const end=point(e),start=first;first=null;const box=[Math.round(Math.min(start[0],end[0])),Math.round(Math.min(start[1],end[1])),Math.round(Math.max(start[0],end[0])),Math.round(Math.max(start[1],end[1]))];try{const r=await fetch('/snapshot.jpg',{cache:'no-store'});if(!r.ok)throw new Error('实时画面尚未就绪');const frameId=Number(r.headers.get('X-Frame-Id'));await r.arrayBuffer();await api('select',{frame_id:frameId,box});unfreeze();}catch(err){showError(err);}};
window.addEventListener('pagehide',()=>{if(current?.tracking?.continuous)return;fetch('/api/stop',{method:'POST',headers:{'Content-Type':'application/json','X-Control-Token':token},body:'{}',keepalive:true}).catch(()=>{});});
async function latestFrame(){
 const began=performance.now(),controller=new AbortController(),timer=setTimeout(()=>controller.abort(),1800);
 try{
   const response=await fetch('/frame.jpg?remote=1',{cache:'no-store',signal:controller.signal});
   if(!response.ok)throw new Error('最新画面尚未就绪');
   const blob=await response.blob();clearTimeout(timer);
   const next=URL.createObjectURL(blob),old=frameURL;
   el('feed').src=next;frameURL=next;
   try{await el('feed').decode();}finally{if(old)URL.revokeObjectURL(old);}
   deliveredAt=performance.now();frameTransfers.push(deliveredAt);frameTransfers=frameTransfers.filter(t=>deliveredAt-t<2000);
   deliveredFPS=frameTransfers.length>1?(frameTransfers.length-1)*1000/(deliveredAt-frameTransfers[0]):0;
   const transfer=deliveredAt-began,age=Number(response.headers.get('X-Frame-Age-Ms'));
   el('videoDelivery').textContent=`最新帧 · 接收/解码 ${transfer.toFixed(0)} ms · 板端帧龄 ${Number.isFinite(age)?age.toFixed(0):'—'} ms`;
   el('feed').style.opacity='1';
 }catch(error){el('feed').style.opacity='.35';el('videoDelivery').textContent='等待最新画面，已停止显示积压帧';}
 finally{clearTimeout(timer);setTimeout(latestFrame,Math.max(0,66-(performance.now()-began)));}
}
latestFrame();refresh();</script></body></html>
